name: Publicar versión

# Se ejecuta al subir una etiqueta vX.Y.Z (ej. v2.9.0). Compila el APK firmado,
# crea el Release en GitHub con las notas de changelogs/X.Y.Z.md y actualiza update.json,
# que es lo que StradaOS consulta para avisar de versiones nuevas.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta existente a publicar (ej. v2.9.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64 (Settings → Secrets and variables → Actions)."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "STRADAOS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Comprobar que la versión coincide con la etiqueta
        run: |
          VN=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "VERSION=$VN" >> "$GITHUB_ENV"
          if [ "v$VN" != "$TAG" ]; then echo "::error::versionName ($VN) no coincide con la etiqueta ($TAG)"; exit 1; fi

      - name: Compilar APK firmado
        env:
          STRADAOS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STRADAOS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STRADAOS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Notas de la versión
        run: |
          F="changelogs/$VERSION.md"
          if [ -f "$F" ]; then cp "$F" "$RUNNER_TEMP/notes.md"; else echo "Mejoras y correcciones." > "$RUNNER_TEMP/notes.md"; fi
          {
            echo ""
            echo "---"
            echo "**Cómo instalar:** descarga \`StradaOS-$VERSION.apk\`, cópialo a una memoria USB, pásalo a la memoria interna de la pantalla e instálalo. Guía completa: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY#-instalación"
          } >> "$RUNNER_TEMP/notes.md"

      - name: Crear el Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: StradaOS ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/notes.md
          files: app/build/outputs/apk/release/StradaOS-*.apk

      - name: Actualizar update.json (aviso dentro de la app)
        run: |
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          jq -n --arg v "$VERSION" --rawfile n "changelogs/$VERSION.md" \
                --arg url "$REPO_URL/releases/tag/$TAG" \
                --arg apk "$REPO_URL/releases/download/$TAG/StradaOS-$VERSION.apk" \
                --arg donate "$(jq -r '.donate_url // empty' update.json 2>/dev/null)" \
                '{version:$v, notes:$n, url:$url, apk:$apk} + (if $donate != "" then {donate_url:$donate} else {} end)' > "$RUNNER_TEMP/update.json" \
            || jq -n --arg v "$VERSION" --arg url "$REPO_URL/releases/tag/$TAG" --arg apk "$REPO_URL/releases/download/$TAG/StradaOS-$VERSION.apk" \
                '{version:$v, notes:"", url:$url, apk:$apk}' > "$RUNNER_TEMP/update.json"
          git fetch origin main
          git checkout main
          cp "$RUNNER_TEMP/update.json" update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet || git commit -m "update.json → $VERSION"
          git push origin main
